name: "ModelDrift"
description: "Scan hard-coded LLM model names and token prices and report drift against a public catalog."
author: "ronterry132-blip"
branding:
  icon: "trending-down"
  color: "orange"
inputs:
  path:
    description: "Directory to scan, relative to the repository root."
    required: false
    default: "."
  prices-url:
    description: "HTTPS URL for prices.json, or a worker /prices endpoint. Falls back to the catalog shipped with the action."
    required: false
    default: ""
  aliases-url:
    description: "HTTPS URL for aliases.json. Defaults to the sibling of prices-url."
    required: false
    default: ""
  deprecations-url:
    description: "HTTPS URL for deprecations.json. Defaults to the sibling of prices-url."
    required: false
    default: ""
  prices-path:
    description: "Local prices.json. When set, aliases.json and deprecations.json are read from the same directory unless overridden."
    required: false
    default: ""
  aliases-path:
    description: "Local aliases.json. Used with prices-path."
    required: false
    default: ""
  deprecations-path:
    description: "Local deprecations.json. Used with prices-path."
    required: false
    default: ""
  tolerance:
    description: "Relative price tolerance. 0.01 flags differences larger than 1%."
    required: false
    default: ""
  fail-on-drift:
    description: "Fail the job when drift is found."
    required: false
    default: "false"
  comment:
    description: "In auto mode, comment on pull requests."
    required: false
    default: "true"
  mode:
    description: "auto comments on pull requests and opens an issue on schedule. Also comment, issue, or report."
    required: false
    default: "auto"
  github-token:
    description: "Token used for pull request comments and issues. Needs pull-requests: write or issues: write."
    required: false
    default: ${{ github.token }}
  ignore:
    description: "Newline-separated ignore globs, relative to the repository root. Replaces the globs in .modeldrift.yml."
    required: false
    default: ""
  use-config:
    description: "Read .modeldrift.yml from the repository root."
    required: false
    default: "true"
  allow-fallback:
    description: "Use the shipped catalog when a prices URL cannot be fetched."
    required: false
    default: "true"
  report-path:
    description: "Where to write the JSON report. Defaults to RUNNER_TEMP/modeldrift-report.json."
    required: false
    default: ""
  max-findings:
    description: "Maximum findings included in the comment and report table."
    required: false
    default: "200"
outputs:
  drift-count:
    description: "Number of drift findings."
  has-drift:
    description: "true when drift-count is greater than zero."
  report-path:
    description: "Path to the JSON report written by this run."
runs:
  using: "node20"
  main: "action/dist/index.js"
