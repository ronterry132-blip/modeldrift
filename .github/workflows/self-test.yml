name: Self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan examples
        uses: ./
        with:
          path: examples
          mode: report
          comment: "false"
          use-config: "false"
          fail-on-drift: "false"
          github-token: ""
          report-path: modeldrift-report.json
      - name: Check the drift report
        run: node scripts/assert-report.mjs modeldrift-report.json self-test/expected-drift.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modeldrift-report
          path: modeldrift-report.json
